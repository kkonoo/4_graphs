<!-- edu_sims: 시뮬레이터 iframe의 높이를 내용에 맞춰 자동으로 조절하고, 교재의 라이트/다크 테마를 시뮬레이터에 전달합니다.
     Quarto의 include-after-body로 한 번만 넣으면 그 페이지의 모든 edu_sims iframe에 적용됩니다.
     시뮬레이터(?embed=1)가 내용 높이가 바뀔 때마다 {type: 'edu-sims:height', height} 메시지를 보내고,
     이 스크립트는 {type: 'edu-sims:theme', theme: 'light' | 'dark'} 메시지로 현재 테마를 알려 줍니다. -->
<script>
  (function () {
    function isDark() {
      return document.body.classList.contains('quarto-dark') ||
        document.documentElement.getAttribute('data-bs-theme') === 'dark';
    }
    var sims = [];   // 높이 메시지를 보내온 시뮬레이터 창들 (= 살아 있는 edu_sims iframe)
    function sendTheme(win) {
      var msg = { type: 'edu-sims:theme', theme: isDark() ? 'dark' : 'light' };
      (win ? [win] : sims).forEach(function (w) { try { w.postMessage(msg, '*'); } catch (e) { /* 닫힌 창 */ } });
    }
    window.addEventListener('message', function (e) {
      var d = e.data;
      if (!d || d.type !== 'edu-sims:height' || typeof d.height !== 'number') return;
      // 메시지를 보낸 창이 이 페이지의 iframe일 때만, 그 iframe 높이만 바꿈
      var frames = document.getElementsByTagName('iframe');
      for (var i = 0; i < frames.length; i++) {
        if (frames[i].contentWindow === e.source) {
          frames[i].style.height = Math.min(Math.max(Math.ceil(d.height), 100), 10000) + 'px';
        }
      }
      if (sims.indexOf(e.source) < 0) sims.push(e.source);
      sendTheme(e.source);   // 시뮬레이터가 살아 있다는 신호이기도 하므로 테마를 알려 줌
    });
    // 교재의 테마 토글을 따라감
    function watch() {
      var obs = new MutationObserver(function () { sendTheme(); });
      obs.observe(document.body, { attributes: true, attributeFilter: ['class'] });
      obs.observe(document.documentElement, { attributes: true, attributeFilter: ['data-bs-theme'] });
    }
    if (document.body) watch(); else document.addEventListener('DOMContentLoaded', watch);
  })();
</script>
