project:
  type: website
  execute-dir: project
  # output-dir: _site

  # ⚠️ Quarto는 "참조된" 파일만 _site/ 로 복사합니다.
  #    ai-chat.js 는 JS에서 동적으로 불러오므로 여기에 명시해야 배포본에 들어갑니다.
  #    (밑줄로 시작하는 _extensions/ 폴더는 아예 복사되지 않습니다)
  resources:
    - assets/ai-chat.js

  # 렌더 대상을 명시 — 이 목록에 없는 .qmd 는 빌드하지 않음
  render:
    - index.qmd
    - chapters/01_why_networks.qmd
    - chapters/02_representation.qmd
    - chapters/03_metrics.qmd
    - chapters/04_random_null.qmd
    - chapters/05_community.qmd
    - chapters/06_propagation.qmd
    - chapters/07_practice.qmd
    - chapters/08_nn_basics.qmd
    - chapters/09_training.qmd
    - chapters/10_architectures.qmd
    - chapters/11_node_embedding.qmd
    - chapters/12_gnn.qmd
    - chapters/13_frontiers.qmd
    - chapters/90_colab_setup.qmd
    - chapters/91_glossary.qmd

website:
  title: "4. 네트워크와 딥러닝"
  description: "생물의학 데이터를 위한 그래프 이론과 신경망"
  favicon: images/logo.ico/favicon.ico
  page-navigation: true          # 페이지 하단에 이전/다음 챕터 링크
  navbar:
    left:
      - href: index.qmd
        text: Home
    right:
      - icon: github
        href: https://github.com/kkonoo/4_graphs

  sidebar:
    style: "floating"
    search: true
    contents:
      - text: "Home"
        href: index.qmd
      - section: "Part 1. 네트워크와 그래프 이론"
        contents:
          - text: "01. 왜 네트워크인가"
            href: chapters/01_why_networks.qmd
          - text: "02. 그래프의 표현"
            href: chapters/02_representation.qmd
          - text: "03. 네트워크 정량화와 중심성"
            href: chapters/03_metrics.qmd
          - text: "04. 랜덤 그래프와 null model"
            href: chapters/04_random_null.qmd
          - text: "05. 커뮤니티와 모듈"
            href: chapters/05_community.qmd
          - text: "06. 전파와 예측"
            href: chapters/06_propagation.qmd
          - text: "07. 실무 — 데이터·편향·시각화"
            href: chapters/07_practice.qmd
      - section: "Part 2. 신경망과 그래프 학습"
        contents:
          - text: "08. 회귀에서 신경망으로"
            href: chapters/08_nn_basics.qmd
          - text: "09. 학습의 실제"
            href: chapters/09_training.qmd
          - text: "10. 알아둘 만한 아키텍처"
            href: chapters/10_architectures.qmd
          - text: "11. 그래프 임베딩"
            href: chapters/11_node_embedding.qmd
          - text: "12. 그래프 신경망"
            href: chapters/12_gnn.qmd
          - text: "13. 최근 흐름과 논문 읽는 눈"
            href: chapters/13_frontiers.qmd
      - section: "부록"
        contents:
          - text: "90. Colab 환경 설정"
            href: chapters/90_colab_setup.qmd
          - text: "91. 용어집"
            href: chapters/91_glossary.qmd

  page-footer:
    left: "Copyright 2026, Eunji"


format:
  html:
    theme:
      light: cosmo
    css: assets/html.css
    toc: true
    toc-depth: 4
    toc-title: "Contents"
    toc-float: true
    page-layout: full

    code-fold: false
    code-copy: true
    highlight-style: github

    number-sections: false
    smooth-scroll: true

    # grid:
    #   sidebar-width: 400px
    #   body-width: 1000px
    #   margin-width: 300px # toc

    # AI 채팅 위젯 전역 설정
    include-after-body: assets/ai-chat-init.html

  revealjs:
    css: assets/revealjs.css    # 슬라이드용


execute:
  freeze: auto          # 코드 실행 결과 캐시 (빠른 빌드)
  echo: true
  eval: false
  warning: false
  message: false
